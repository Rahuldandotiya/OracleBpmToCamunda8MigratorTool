name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests, sample conversions and deployment to an in-memory Zeebe engine
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Convert samples with the CLI
        run: |
          java -jar migrator-cli/target/oracle2c8.jar convert samples -o camunda8-output --fail-on-issues
          cat camunda8-output/conversion-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: oracle2c8-cli
          path: |
            migrator-cli/target/oracle2c8.jar
            camunda8-output/
