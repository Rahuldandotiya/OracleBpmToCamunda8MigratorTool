# Settings for "oracle2c8 serve" (web UI) and "oracle2c8 analyze".
#
# Every value is read from an environment variable; the text after ':' is the default used when
# the variable is not set. No credentials are stored in this file, so it is safe to commit.
#
#   export CAMUNDA_WEBMODELER_CLIENT_ID=...
#   export CAMUNDA_WEBMODELER_CLIENT_SECRET=...
#   java -jar migrator-cli/target/oracle2c8.jar serve
#
# The variable name is the key in upper case with '.' and '-' replaced by '_'. That rule also
# works without this file (for example when the jar runs in another folder).

# ------------------------------------------------------------------ web UI
# Keep 127.0.0.1 unless other machines must reach the UI (anyone who can reach it can upload files).
server.host=${SERVER_HOST:127.0.0.1}
server.port=${SERVER_PORT:8080}
# Upload limits per browser session
server.max-upload-mb=${SERVER_MAX_UPLOAD_MB:200}
server.max-files=${SERVER_MAX_FILES:5000}
# Idle sessions (uploaded files and results) are deleted after this many minutes
server.workspace-ttl-minutes=${SERVER_WORKSPACE_TTL_MINUTES:240}

# ------------------------------------------------------------------ conversion defaults
# Folder with finished migrations (Oracle + Camunda 8 models) the converter learns from
migrator.knowledge-base-dir=${MIGRATOR_KNOWLEDGE_BASE_DIR:knowledge-base}
# Camunda version written into the models: 8.5.0, 8.6.0, 8.7.0, 8.8.0
migrator.platform-version=${MIGRATOR_PLATFORM_VERSION:8.6.0}
# camunda (Camunda user tasks) or job-worker (job-worker based user tasks)
migrator.user-tasks=${MIGRATOR_USER_TASKS:camunda}

# ------------------------------------------------------------------ Camunda Web Modeler (upload, no deploy)
# saas or self-managed
camunda.webmodeler.mode=${CAMUNDA_WEBMODELER_MODE:saas}

# API client credentials
#   SaaS:         Console > Organization > Administration API > Create new credentials,
#                 with Web Modeler API permissions Create, Read and Update.
#   Self-Managed: Identity > Applications > add an M2M application,
#                 with Web Modeler API permissions Create, Read and Update.
camunda.webmodeler.client-id=${CAMUNDA_WEBMODELER_CLIENT_ID:}
camunda.webmodeler.client-secret=${CAMUNDA_WEBMODELER_CLIENT_SECRET:}

# Target project: an existing project id, or a project name (found or created)
camunda.webmodeler.project-id=${CAMUNDA_WEBMODELER_PROJECT_ID:}
camunda.webmodeler.project-name=${CAMUNDA_WEBMODELER_PROJECT_NAME:Oracle BPM migration}

# Endpoints. Empty means the default for the mode:
#   SaaS:         api-url   https://modeler.cloud.camunda.io
#                 token-url https://login.cloud.camunda.io/oauth/token
#                 audience  api.cloud.camunda.io
#   Self-Managed: api-url   http://localhost:8070
#                 token-url http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token
#                 audience  web-modeler-api
# Some identity providers (e.g. Microsoft Entra ID) need a scope instead of an audience,
# e.g. api://<web-modeler-api-app-id>/.default
camunda.webmodeler.api-url=${CAMUNDA_WEBMODELER_API_URL:}
camunda.webmodeler.token-url=${CAMUNDA_WEBMODELER_TOKEN_URL:}
camunda.webmodeler.audience=${CAMUNDA_WEBMODELER_AUDIENCE:}
camunda.webmodeler.scope=${CAMUNDA_WEBMODELER_SCOPE:}
camunda.webmodeler.timeout-seconds=${CAMUNDA_WEBMODELER_TIMEOUT_SECONDS:30}

# ------------------------------------------------------------------ effort estimate (analyze)
# Hours per follow-up item; the estimate is a planning aid, not a quote.
analyze.hours.form=${ANALYZE_HOURS_FORM:4}
analyze.hours.job-worker=${ANALYZE_HOURS_JOB_WORKER:6}
analyze.hours.inbound-trigger=${ANALYZE_HOURS_INBOUND_TRIGGER:6}
analyze.hours.correlation=${ANALYZE_HOURS_CORRELATION:1}
analyze.hours.undefined-task=${ANALYZE_HOURS_UNDEFINED_TASK:2}
analyze.hours.expression=${ANALYZE_HOURS_EXPRESSION:1}
analyze.hours.unsupported=${ANALYZE_HOURS_UNSUPPORTED:4}
analyze.hours.secret=${ANALYZE_HOURS_SECRET:0.5}
analyze.hours.review=${ANALYZE_HOURS_REVIEW:0.5}
analyze.hours.failed-file=${ANALYZE_HOURS_FAILED_FILE:16}
# Testing and deployment per converted process
analyze.hours.per-process=${ANALYZE_HOURS_PER_PROCESS:4}
